---
layout: layout
---

<article class="article">
  <header class="article-header">
    <time class="article-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.tags.size > 0 %}
      <p class="article-tags">{% for tag in page.tags %}<span>{{ tag | downcase }}</span>{% endfor %}</p>
    {% endif %}
  </header>

  <div class="article-content">
    {{ content }}
  </div>
</article>
