<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ site.author }}">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#fbfbfa">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/static/img/favicon.svg' | relative_url }}">
    <link rel="alternate icon" href="{{ '/static/img/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="{{ '/static/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" rel="stylesheet">
    <script>
      (function () {
        var savedTheme = localStorage.getItem('theme');
        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme || systemTheme;
      }());
    </script>
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    {% include analytics.html %}
  </head>
  <body>
    <div class="site-shell">
      {% include header.html %}
      <main class="site-main" id="main-content">
        {{ content }}
      </main>
    </div>
    <script>
      (function () {
        var toggle = document.querySelector('.theme-toggle');
        if (!toggle) return;

        function render(theme) {
          var nextTheme = theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          toggle.setAttribute('aria-label', 'Use ' + nextTheme + ' theme');
          document.querySelector('meta[name="theme-color"]').setAttribute(
            'content', theme === 'dark' ? '#181a19' : '#fbfbfa'
          );
        }

        render(document.documentElement.dataset.theme || 'light');
        toggle.addEventListener('click', function () {
          var theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('theme', theme);
          render(theme);
        });
      }());
    </script>
  </body>
</html>
